baseURL = "https://example.com/"
locale = "en-GB"
title = "Hugo Theme - Bookshelf"
theme = "hugo-theme-bookshelf"
# Lets you run `hugo server` from inside exampleSite/ without copying the theme.
# Remove this line in your own site.
themesDir = "../.."

# Optional. Supports {year}, e.g. "&copy; {year} Your Name"
# copyright = ""

[pagination]
  pagerSize = 10

# If you want to track using GA or use disqus for comments, uncomment the
# following and add the correct values. GA is only included in production builds.
[services]
  [services.disqus]
    # shortname = ""
  [services.googleAnalytics]
    # ID = "G-XXXXXXXXXX"

[params]
  tagline = "Thoughts on engineering and management"
  author = "Pravin Paratey"
  authorImgPath = "/img/author.png"
  authorBlurb = "Something about me"
  # Which sections appear on the shelf, in the catalogue and in the RSS feed
  mainSections = ["posts"]
  # Colour scheme: "auto" follows the visitor's OS setting; "light" or "dark" forces one
  defaultTheme = "auto"
  # Show the "Lamp off / Lamp on" toggle
  themeToggle = true

  [params.bookshelf]
    # Shown under the tagline on the home page
    intro = "Each spine is as thick as the piece is long and coloured by its subject. Pull one out to read it."
    # Spine widths in pixels, and the word count that gives the widest spine
    minSpine = 40
    maxSpine = 120
    fullSpineWords = 1500
    # Spine heights vary between these, chosen from the title so they stay put
    minHeight = 280
    maxHeight = 370
    # Letters at the foot of each spine. Defaults to the author's initials
    # monogram = "PP"
    # Show only the newest N spines on the shelf (0 = all)
    maxSpines = 0
    # Number of subjects listed on the home page
    subjectsLimit = 12
    # Pin a subject (first tag of a post) to a cloth colour
    # [params.bookshelf.colors]
    #   markdown = "#7B2A26"

  # If you do not want a social link, just comment it out
  [params.social]
    email = "mailto:example@example.com"
    mastodon = "https://mstdn.social/@example"
    bluesky = "https://bsky.app/profile/example.com"
    github = "https://github.com/example"
    twitter = "https://x.com/example"
    linkedin = "https://www.linkedin.com/in/example"
    # medium = "https://medium.com/@example"
    # facebook = "https://www.facebook.com/example"
    # twitteruser = "@example"

# Optional: replace the default The shelf / Subjects / About links
# [[menus.main]]
#   name = "The shelf"
#   pageRef = "/"
#   weight = 10

[markup]
  # The theme ships light and dark syntax colours, which need CSS classes
  [markup.highlight]
    noClasses = false
  # Allows raw HTML in markdown content and in markdownify'd descriptions.
  [markup.goldmark.renderer]
    unsafe = true
