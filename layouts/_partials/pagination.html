{{- if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
    {{- if .HasPrev }}
    <a href="{{ .Prev.URL }}" rel="prev"><span aria-hidden="true">&larr;</span> Newer</a>
    {{- else }}
    <span aria-hidden="true"></span>
    {{- end }}
    <span class="pagination__folio">page {{ .PageNumber }} of {{ .TotalPages }}</span>
    {{- if .HasNext }}
    <a href="{{ .Next.URL }}" rel="next">Older <span aria-hidden="true">&rarr;</span></a>
    {{- else }}
    <span aria-hidden="true"></span>
    {{- end }}
</nav>
{{- end }}
